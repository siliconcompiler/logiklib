name: Basic CI
on:
  # Runs on all PRs
  pull_request:
  # Manual Dispatch
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The repository default is write-all; nothing here writes.
permissions:
  contents: read

jobs:

  python_ci:
    name: "Python CI"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: pytest
        env:
          # SC's package fetcher reads GIT_TOKEN when it pulls data during the
          # tests. logiklib's only dependency is siliconcompiler, and the data
          # it fetches is public, so the repo-scoped GITHUB_TOKEN is enough --
          # it buys authenticated API rate limits, not private access.
          GIT_TOKEN: ${{ github.token }}
        run: |
          python3 -m venv .venv
          . .venv/bin/activate

          python3 -m pip install --upgrade pip
          python3 -m pip install -e .[test]

          mkdir testingdir
          cd testingdir

          pytest ../tests

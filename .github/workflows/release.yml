name: Release

on:
  release:
    types:
      - published

# The repository default is write-all, so without a floor here any job added
# later inherits every scope. Jobs opt into exactly what they need.
permissions: {}

jobs:
  forward_artifacts:
    name: Forward artifacts
    runs-on: ubuntu-latest

    # Releases live under the contents scope: read to list/download the
    # previous one, write to upload onto the new one.
    permissions:
      contents: write

    env:
      # Without this every gh call below exits 4: the CLI does not pick up a
      # token on its own in Actions. This workflow had never had a successful
      # run before it was added.
      GH_TOKEN: ${{ github.token }}

    steps:
    - name: Get previous artifacts
      run: |
        prev=$(gh release list --repo ${{ github.repository }} --order desc --limit 2 --json name --jq '.[].name' | tail -n1)
        mkdir artifacts
        gh release download --repo ${{ github.repository }} $prev --dir artifacts
        rm -f artifacts/*.whl

    - name: Upload to new release
      run: |
        gh release upload ${{ github.ref }} artifacts/* --repo ${{ github.repository }}
